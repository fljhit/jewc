<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JewCasino Mines</title>

<style>
body{
background:#0f212e;
color:white;
font-family:Arial;
padding:20px;
margin:0;
}

.watermark{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
opacity:.05;
pointer-events:none;
z-index:0;
}

.watermark img{
width:500px;
}

.container{
position:relative;
z-index:1;
}

.card{
background:#172b3a;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

input,select{
padding:10px;
border:none;
border-radius:8px;
width:100px;
margin-right:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin:5px;
}

.grid{
display:grid;
grid-template-columns:repeat(5,90px);
gap:10px;
margin-top:20px;
justify-content:center;
}

.tile{
width:90px;
height:90px;
background:#1f3a4d;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
cursor:pointer;
user-select:none;
transition:.2s;
}

.tile:hover{
background:#294c63;
transform:scale(1.05);
}

#multiplier{
font-size:28px;
font-weight:bold;
margin-top:15px;
text-align:center;
}

#message{
font-size:24px;
font-weight:bold;
margin-top:15px;
text-align:center;
}
</style>

</head>

<body>

<div class="watermark">
<img src="logo.png.png">
</div>

<div class="container">

<button onclick="location.href='index.html'">🏠 Home</button>

<h1>💣 Mines</h1>

<div class="card">

<h2>Balance: $<span id="balance">1000</span></h2>

Bet: <input id="bet" type="number" value="25">

Mines: <select id="mineCount">

<option>1</option>
<option>3</option>
<option>5</option>
<option>10</option>
<option>15</option>
<option>20</option>
<option>24</option>
</select>

<br><br>

<button onclick="startGame()">Start Game</button> <button onclick="cashOut()">Cash Out</button>

<div id="multiplier">Multiplier: 1.00x</div>

<div id="message"></div>

</div>

<div class="grid" id="grid"></div>

</div>

<script>

let balance=parseInt(localStorage.getItem("balance")||1000);
document.getElementById("balance").innerText=balance;

let mines=[];
let active=false;
let multiplier=1;
let betAmount=0;
let mineCount=3;

function save(){
localStorage.setItem("balance",balance);
document.getElementById("balance").innerText=balance;
}

function startGame(){

betAmount=parseInt(document.getElementById("bet").value);
mineCount=parseInt(document.getElementById("mineCount").value);

if(betAmount<=0||betAmount>balance){
alert("Invalid bet");
return;
}

active=true;
multiplier=1;

document.getElementById("message").innerText="";
document.getElementById("multiplier").innerText="Multiplier: 1.00x";

mines=[];

while(mines.length<mineCount){

let spot=Math.floor(Math.random()*25);

if(!mines.includes(spot)){
mines.push(spot);
}

}

let grid=document.getElementById("grid");
grid.innerHTML="";

for(let i=0;i<25;i++){

let tile=document.createElement("div");

tile.className="tile";

tile.onclick=function(){
pickTile(i,tile);
};

grid.appendChild(tile);

}

}

function pickTile(index,tile){

if(!active)return;

if(tile.innerHTML!="")return;

if(mines.includes(index)){

tile.innerHTML="💣";

let allTiles=document.querySelectorAll(".tile");

for(let i=0;i<25;i++){

if(mines.includes(i)){
allTiles[i].innerHTML="💣";
}

}

balance-=betAmount;
save();

document.getElementById("message").innerText="💥 BOOM!";

active=false;

return;
}

tile.innerHTML="💎";

let increase=0.05+(mineCount*0.03);

multiplier+=increase;

document.getElementById("multiplier").innerText=
"Multiplier: "+multiplier.toFixed(2)+"x";

}

function cashOut(){

if(!active)return;

let winnings=Math.floor(betAmount*multiplier);

balance+=winnings;

save();

document.getElementById("message").innerText=
"💰 Cashed Out: $"+winnings;

active=false;

}

</script>

</body>
</html>
