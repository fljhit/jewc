<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JewCasino</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f212e;
color:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#172b3a;
}

.logo{
font-size:28px;
font-weight:bold;
}

.balance{
background:#1f3a4d;
padding:10px 15px;
border-radius:10px;
}

.hero{
padding:25px;
}

.hero h1{
font-size:38px;
margin-bottom:10px;
}

.hero p{
opacity:.8;
}

.buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.btn{
padding:12px 20px;
border:none;
border-radius:10px;
font-size:16px;
}

.login{
background:#2f4553;
color:white;
}

.register{
background:#00e701;
color:black;
font-weight:bold;
}

.games{
padding:20px;
display:grid;
grid-template-columns:1fr;
gap:15px;
}

.card{
background:#172b3a;
padding:20px;
border-radius:15px;
}

.card h2{
margin-top:0;
}

.play{
background:#00e701;
border:none;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
}

.footer{
text-align:center;
padding:30px;
opacity:.6;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">🎰 JewCasino</div>
<div class="balance">$<span id="balance">1000</span> Demo Credits</div>
</div>

<div class="hero">
<h1>Welcome to JewCasino</h1>
<p>Play demo casino games with fake credits.</p>

<div class="buttons">
<button class="btn login">Login</button>
<button class="btn register">Register</button>
</div>
</div>

<div class="games">

<div class="card">
<h2>🃏 Blackjack</h2>
<p>Beat the dealer and win demo credits.</p>
<button class="play" onclick="location.href='Blackjack.html'">Play Blackjack</button>
</div>

<div class="card">
<h2>🎲 Dice</h2>
<p>Roll and win big demo payouts.</p>
<button class="play" onclick="location.href='Dice.html'">Play Dice</button>
</div>

</div>

<div class="footer">
JewCasino Demo • Fake Money Only
</div>
<script>
document.getElementById("balance").innerText =
localStorage.getItem("balance") || 1000;
</script>
</body>
</html>
