<script>

let balance=parseInt(localStorage.getItem("balance")||1000);
document.getElementById("balance").innerText=balance;

function save(){
localStorage.setItem("balance",balance);
document.getElementById("balance").innerText=balance;
}

const deck=[
"SA","S2","S3","S4","S5","S6","S7","S8","S9","S10","SJ","SQ","SK",
"HA","H2","H3","H4","H5","H6","H7","H8","H9","H10","HJ","HQ","HK",
"DA","D2","D3","D4","D5","D6","D7","D8","D9","D10","DJ","DQ","DK",
"CA","C2","C3","C4","C5","C6","C7","C8","C9","C10","CJ","CQ","CK"
];

function randomCard(){
return deck[Math.floor(Math.random()*deck.length)];
}

function handScore(hand){

let total=0;

for(let card of hand){
total+=baccaratValue(card);
}

return total%10;

}

function showHand(id,hand){

let html="";

for(let card of hand){

html+=
`<img src="${card}.png">`;

}

document.getElementById(id).innerHTML=html;

}

function play(choice){

let bet=parseInt(document.getElementById("bet").value);

if(bet<=0||bet>balance){
alert("Invalid bet");
return;
}

let player=[
randomCard(),
randomCard()
];

let banker=[
randomCard(),
randomCard()
];

let playerTotal=handScore(player);
let bankerTotal=handScore(banker);

showHand("playerHand",player);
showHand("bankerHand",banker);

document.getElementById("playerScore").innerText=
"Score: "+playerTotal;

document.getElementById("bankerScore").innerText=
"Score: "+bankerTotal;

let winner="";

if(playerTotal>bankerTotal){
winner="player";
}else if(bankerTotal>playerTotal){
winner="banker";
}else{
winner="tie";
}

let payout=0;

if(choice===winner){

if(winner==="tie"){
payout=bet*8;
}else{
payout=bet*2;
}

balance=balance-bet+payout;

document.getElementById("message").innerText=
"🎉 "+winner.toUpperCase()+" WINS! Won $"+payout;

}else{

balance-=bet;

document.getElementById("message").innerText=
"❌ "+winner.toUpperCase()+" WINS";

}

save();

}
