<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JewCasino Chicken</title>

<style>

body{
background:#0f212e;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
text-align:center;
}

.watermark{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
opacity:.05;
pointer-events:none;
z-index:0;
}

.watermark img{
width:600px;
}

.container{
position:relative;
z-index:1;
}

.card{
background:#172b3a;
padding:20px;
border-radius:15px;
max-width:900px;
margin:auto;
margin-bottom:20px;
}

input{
padding:10px;
border:none;
border-radius:8px;
width:120px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin:5px;
}

.board{
display:flex;
flex-direction:column-reverse;
gap:10px;
max-width:700px;
margin:auto;
}

.row{
display:flex;
justify-content:center;
gap:10px;
}

.tile{
width:90px;
height:90px;
background:#1f3a4d;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
cursor:pointer;
}

.tile:hover{
background:#2b516b;
}

#multiplier{
font-size:28px;
font-weight:bold;
margin-top:15px;
}

#message{
font-size:24px;
font-weight:bold;
margin-top:15px;
}

</style>

</head>

<body>

<div class="watermark">
<img src="logo.png.png">
</div>

<div class="container">

<button onclick="location.href='index.html'">🏠 Home</button>

<h1>🐔 Chicken</h1>

<div class="card">

<h2>Balance: $<span id="balance">1000</span></h2>

Bet: <input id="bet" type="number" value="25">

<button onclick="startGame()">Start Game</button> <button onclick="cashOut()">Cash Out</button>

<div id="multiplier">Multiplier: 1.00x</div>

<div id="message"></div>

</div>

<div class="board" id="board"></div>

<script>

let balance=parseInt(localStorage.getItem("balance")||1000);
document.getElementById("balance").innerText=balance;

function save(){
localStorage.setItem("balance",balance);
document.getElementById("balance").innerText=balance;
}

let active=false;
let currentRow=0;
let multiplier=1;
let betAmount=0;

const board=document.getElementById("board");

function startGame(){

betAmount=parseInt(document.getElementById("bet").value);

if(betAmount<=0||betAmount>balance){
alert("Invalid bet");
return;
}

active=true;
currentRow=0;
multiplier=1;

document.getElementById("message").innerText="";
document.getElementById("multiplier").innerText=
"Multiplier: 1.00x";

board.innerHTML="";
for(let row=0;row<8;row++){

let rowDiv=document.createElement("div");
rowDiv.className="row";

let badSpot=Math.floor(Math.random()*5);

for(let col=0;col<5;col++){

let tile=document.createElement("div");

tile.className="tile";
tile.innerHTML="🥚";

tile.dataset.row=row;
tile.dataset.col=col;
tile.dataset.bad=(col===badSpot);

tile.onclick=function(){
pickTile(tile);
};

rowDiv.appendChild(tile);

}

board.appendChild(rowDiv);

}

}

function pickTile(tile){

if(!active)return;

let row=parseInt(tile.dataset.row);

if(row!==currentRow)return;

if(tile.dataset.bad==="true"){

tile.innerHTML="🦊";

balance-=betAmount;
save();

document.getElementById("message").innerText=
"💥 FOX GOT THE CHICKEN!";

active=false;

return;

}

tile.innerHTML="🐔";

multiplier+=0.25;

document.getElementById("multiplier").innerText=
"Multiplier: "+multiplier.toFixed(2)+"x";

currentRow++;

if(currentRow>=8){

let winnings=Math.floor(betAmount*multiplier);

balance+=winnings;

save();

document.getElementById("message").innerText=
"🏆 CHICKEN ESCAPED! Won $"+winnings;

active=false;

}

}

function cashOut(){

if(!active)return;

let winnings=Math.floor(betAmount*multiplier);

balance+=winnings;

save();

document.getElementById("message").innerText=
"💰 Cashed Out: $"+winnings;

active=false;

}

</script>

</body>
</html>
