<!DOCTYPE html>
<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JewCasino Roulette</title>

<style>
body{
background:#0f212e;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
text-align:center;
overflow-x:hidden;
}

.watermark{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
opacity:.05;
pointer-events:none;
z-index:0;
}

.watermark img{
width:600px;
}

.container{
position:relative;
z-index:1;
}

.card{
background:#172b3a;
padding:20px;
border-radius:15px;
max-width:900px;
margin:auto;
margin-bottom:20px;
}

input,select{
padding:10px;
border:none;
border-radius:8px;
margin:5px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin:5px;
}

.roulette-container{
position:relative;
width:600px;
height:600px;
margin:30px auto;
}

.wheel{
width:600px;
height:600px;
border-radius:50%;
position:relative;
border:12px solid #222;
background:#111;
overflow:hidden;
transition:transform 6s cubic-bezier(.15,.85,.25,1);
}

.ball{
position:absolute;
width:24px;
height:24px;
border-radius:50%;
background:white;
top:288px;
left:288px;
z-index:50;
box-shadow:0 0 10px white;
transition:all 1s ease;
}

.number{
position:absolute;
width:42px;
height:42px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
color:white;
}

.red{
background:#c62828;
}

.black{
background:#111;
border:1px solid #666;
}

.green{
background:#00a651;
}

.glow{
box-shadow:0 0 20px gold;
}

#result{
font-size:36px;
font-weight:bold;
margin-top:20px;
}

#message{
font-size:24px;
font-weight:bold;
margin-top:15px;
}
</style>

</head>

<body>

<div class="watermark">
<img src="logo.png.png">
</div>

<div class="container">

<button onclick="location.href='index.html'">🏠 Home</button>

<h1>🎡 Roulette</h1>

<div class="card">

<h2>Balance: $<span id="balance">1000</span></h2>

Bet: <input id="bet" type="number" value="25">

<select id="betType">
<option value="red">Red</option>
<option value="black">Black</option>
<option value="number">Number</option>
</select>

<input id="numberBet" type="number" min="0" max="36" value="7">

<button onclick="spin()">Spin Wheel</button>

<div id="message"></div>

</div>

<div class="roulette-container">

<div class="wheel" id="wheel"></div>

<div class="ball" id="ball"></div>

</div>

<div id="result">Waiting For Spin...</div>

<script>

let balance=parseInt(localStorage.getItem("balance")||1000);
document.getElementById("balance").innerText=balance;

function save(){
localStorage.setItem("balance",balance);
document.getElementById("balance").innerText=balance;
}

const wheel=document.getElementById("wheel");
const ball=document.getElementById("ball");

const redNumbers=[
1,3,5,7,9,12,14,16,18,
19,21,23,25,27,30,32,34,36
];

for(let i=0;i<=36;i++){

let div=document.createElement("div");

div.className="number";

if(i===0){
div.classList.add("green");
}else if(redNumbers.includes(i)){
div.classList.add("red");
}else{
div.classList.add("black");
}

div.id="num"+i;
div.innerText=i;

const angle=(i/37)*360;
const radius=250;

const x=Math.cos(angle*Math.PI/180)*radius+280;
const y=Math.sin(angle*Math.PI/180)*radius+280;

div.style.left=x+"px";
div.style.top=y+"px";

wheel.appendChild(div);

}

let spinning=false;
function spin(){

if(spinning)return;

let bet=parseInt(document.getElementById("bet").value);

if(bet<=0||bet>balance){
alert("Invalid bet");
return;
}

spinning=true;

for(let i=0;i<=36;i++){
let el=document.getElementById("num"+i);
if(el) el.classList.remove("glow");
}

let resultNumber=Math.floor(Math.random()*37);

let spins=360*10;
let stopAngle=(resultNumber/37)*360;

wheel.style.transform=
`rotate(${spins+stopAngle}deg)`;

let orbitAngle=0;

let orbit=setInterval(function(){

orbitAngle+=15;

let orbitRadius=285;

let x=Math.cos(orbitAngle*Math.PI/180)*orbitRadius+288;
let y=Math.sin(orbitAngle*Math.PI/180)*orbitRadius+288;

ball.style.left=x+"px";
ball.style.top=y+"px";

},30);

setTimeout(function(){

clearInterval(orbit);

let angle=(resultNumber/37)*360;

let radius=250;

let x=Math.cos(angle*Math.PI/180)*radius+288;
let y=Math.sin(angle*Math.PI/180)*radius+288;

ball.style.left=x+"px";
ball.style.top=y+"px";

let winningPocket=document.getElementById("num"+resultNumber);

if(winningPocket){
winningPocket.classList.add("glow");
}

let betType=document.getElementById("betType").value;

let win=false;
let payout=0;

if(betType==="red"){

if(redNumbers.includes(resultNumber)){
win=true;
payout=bet*2;
}

}else if(betType==="black"){

if(resultNumber!==0 &&
!redNumbers.includes(resultNumber)){
win=true;
payout=bet*2;
}

}else{

let chosen=
parseInt(document.getElementById("numberBet").value);

if(chosen===resultNumber){
win=true;
payout=bet*35;
}

}

let result=document.getElementById("result");

if(resultNumber===0){

result.style.color="#00e701";
result.innerText="🟢 0";

}else if(redNumbers.includes(resultNumber)){

result.style.color="#ff4d4d";
result.innerText="🔴 "+resultNumber;

}else{

result.style.color="white";
result.innerText="⚫ "+resultNumber;

}

if(win){

balance=balance-bet+payout;

document.getElementById("message").innerText=
"🎉 WIN! Won $"+payout;

}else{

balance-=bet;

document.getElementById("message").innerText=
"❌ LOSE! Number "+resultNumber;

}

save();

spinning=false;

},6000);

}

</script>

</body>
</html>
